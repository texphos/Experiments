# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). On a Mac: `brew install xcodegen && xcodegen generate`.
# Not generated or built in the authoring environment (Linux, no Xcode) — see README "Verification status".
name: Hearthday
options:
  bundleIdPrefix: app.hearthday
  deploymentTarget:
    iOS: "17.0"
packages:
  HearthdayCore:
    path: Core
targets:
  Hearthday:
    type: application
    platform: iOS
    sources:
      - path: App/Hearthday
    dependencies:
      - package: HearthdayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hearthday.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hearthday
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme:
      storeKitConfiguration: App/Hearthday/Resources/Hearthday.storekit
      testTargets:
        - package: HearthdayCore/HearthdayCoreTests
