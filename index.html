<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8fbf" />
  <title>Sugar Flap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff4f93'/%3E%3Ccircle cx='40' cy='28' r='6' fill='%23fff'/%3E%3Ccircle cx='42' cy='28' r='3' fill='%232b1d24'/%3E%3Cpath d='M46 30l12 4-12 5z' fill='%23ffb000'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="frame">
    <canvas id="game" width="432" height="768" aria-label="Sugar Flap, a candy themed flappy bird game"></canvas>

    <section id="menu" class="overlay menu">
      <div class="brand">
        <p class="eyebrow">Candy shop skies</p>
        <h1>Sugar Flap</h1>
        <p class="tag">Flap a gumdrop through the candy canes.</p>
      </div>
      <div class="menu-actions">
        <p id="menu-best" class="best-chip" hidden></p>
        <button id="play" type="button" class="btn">Play</button>
        <p class="controls">Space, click, or tap to flap</p>
      </div>
    </section>

    <section id="gameover" class="overlay over hidden" aria-live="polite">
      <div class="card">
        <p class="eyebrow">Melted</p>
        <h2>Oh sugar!</h2>
        <div id="medal" class="medal" hidden></div>
        <p id="new-best" class="new-best" hidden>New best!</p>
        <dl class="stats">
          <div>
            <dt>Score</dt>
            <dd id="final-score">0</dd>
          </div>
          <div>
            <dt>Best</dt>
            <dd id="best-score">0</dd>
          </div>
        </dl>
        <button id="again" type="button" class="btn">Try again</button>
      </div>
    </section>

    <section id="paused" class="overlay pause hidden">
      <div class="card">
        <h2>Paused</h2>
        <p class="tag">The sweets will wait.</p>
        <button id="resume" type="button" class="btn">Resume</button>
      </div>
    </section>

    <button id="mute" type="button" class="mute" aria-pressed="false" aria-label="Mute">🔊</button>
    <p id="live" class="sr-only" aria-live="polite"></p>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
